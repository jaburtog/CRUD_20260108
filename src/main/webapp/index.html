<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Control System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Inventory Control System</h1>
            <p class="subtitle">Manage your product inventory efficiently</p>
        </header>

        <div class="stats">
            <div class="stat-card">
                <span class="stat-label">Total Products</span>
                <span class="stat-value" id="totalProducts">0</span>
            </div>
        </div>

        <div class="main-content">
            <!-- Add/Edit Product Form -->
            <section class="form-section">
                <h2 id="formTitle">Add New Product</h2>
                <form id="productForm">
                    <input type="hidden" id="productId">
                    
                    <div class="form-group">
                        <label for="name">Product Name *</label>
                        <input type="text" id="name" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="sku">SKU *</label>
                        <input type="text" id="sku" required maxlength="50">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <input type="text" id="category" maxlength="50" placeholder="e.g., Electronics, Food">
                        </div>

                        <div class="form-group">
                            <label for="quantity">Quantity *</label>
                            <input type="number" id="quantity" required min="0" value="0">
                        </div>

                        <div class="form-group">
                            <label for="price">Price ($) *</label>
                            <input type="number" id="price" required min="0" step="0.01" value="0.00">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" rows="3" maxlength="500"></textarea>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary" id="submitBtn">Add Product</button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </section>

            <!-- Products List -->
            <section class="list-section">
                <div class="section-header">
                    <h2>Products Inventory</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search products...">
                    </div>
                </div>

                <div id="loading" class="loading">Loading products...</div>
                <div id="error" class="error" style="display: none;"></div>

                <div class="table-container">
                    <table id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>SKU</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Price</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
